<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{{subject}}</title>
  <style>
    @media only screen and (max-width: 480px) {
      .outer-pad { padding: 20px 12px !important; }
      .card-pad { padding: 26px 20px !important; }
      .hero-pad { padding: 22px 18px !important; }
      .hero-title { font-size: 23px !important; }
      .mascot-cell { width:108px !important; }
      .mongi { width: 108px !important; height: auto !important; }
      .code { font-size: 34px !important; letter-spacing: 7px !important; padding-left: 7px !important; }
    }
    @media (prefers-color-scheme: dark) {
      body, .mail-page { background-color: #211a2b !important; }
      .mail-card { background-color: #2e2438 !important; }
      .brand, .hero-title, .mail-ink { color: #f0e6f8 !important; }
      .hero { background-color: #44334f !important; background-image: linear-gradient(125deg, #49395d, #503842) !important; }
      .muted { color: #b9a7c5 !important; }
      .code-panel { background-color: #3b2e49 !important; border-color: #584368 !important; }
      .code { color: #f4e8ff !important; }
      .expiry { background-color: #554064 !important; color: #e7d4f3 !important; }
      .notice { background-color: #352a40 !important; }
      .divider { border-top-color: #493b54 !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; width:100%; background-color:#f5eff8; -webkit-text-size-adjust:100%; font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans',Arial,sans-serif;">
  <div style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5eff8" class="mail-page" style="width:100%; background-color:#f5eff8;">
    <tr><td align="center" class="outer-pad" style="padding:36px 16px;">
      <!-- Tables, inline styles and solid background fallbacks keep the code readable in email clients. -->
      <table role="presentation" width="540" cellpadding="0" cellspacing="0" border="0" bgcolor="#fffafc" class="mail-card" style="width:100%; max-width:540px; background-color:#fffafc; border-radius:30px;">
        <tr><td class="card-pad" style="padding:32px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td class="brand" style="color:#514061; font-size:28px; font-weight:800; line-height:1; letter-spacing:-1.5px;">remory<span style="color:#d89bb7;">.</span></td>
              <td align="right" class="muted" style="color:#a18cac; font-size:10px; line-height:1.5; letter-spacing:1.6px;">LITTLE BY LITTLE</td>
            </tr>
            <tr><td colspan="2" height="26" style="height:26px; font-size:1px; line-height:1px;">&nbsp;</td></tr>
          </table>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#efe3f8" class="hero" style="background-color:#efe3f8; background-image:linear-gradient(125deg,#ece1fa 0%,#f9e7ed 76%,#fff0dc 100%); border-radius:24px;">
            <tr><td class="hero-pad" style="padding:25px 22px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td valign="middle">
                    <h1 class="hero-title" style="margin:0 0 10px; color:#5e4676; font-size:25px; line-height:1.4; letter-spacing:-.7px; font-weight:750;">{{title}}</h1>
                    <p class="mail-ink" style="margin:0; color:#776286; font-size:13px; line-height:1.8; word-break:{{wordBreak}}; overflow-wrap:break-word;">{{intro}}</p>
                  </td>
                  <td class="mascot-cell" width="136" align="right" valign="middle" style="width:136px;">
                    <img class="mongi" src="cid:remory-mongi" width="136" height="117" alt="{{mascotAlt}}" style="display:block; width:136px; height:auto; border:0; outline:none;" />
                  </td>
                </tr>
              </table>
            </td></tr>
          </table>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr><td height="24" style="height:24px; font-size:1px; line-height:1px;">&nbsp;</td></tr>
          </table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f7f2fc" class="code-panel" style="background-color:#f7f2fc; border:1px solid #e9def2; border-radius:22px;">
            <tr><td align="center" style="padding:24px 12px 22px;">
              <p class="muted" style="margin:0 0 13px; color:#9b83ac; font-size:12px; line-height:1.5; font-weight:600;">{{codeLabel}}</p>
              <!-- Keep all six digits in one text node so copying preserves leading zeros. -->
              <p class="code" dir="ltr" style="margin:0 0 16px; padding-left:9px; color:#65487f; font-family:ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace; font-size:40px; line-height:1.25; font-weight:700; letter-spacing:9px; white-space:nowrap;">{{code}}</p>
              <span class="expiry" style="display:inline-block; padding:7px 12px; border-radius:99px; background-color:#eee5f7; color:#8b6e9f; font-size:11px; line-height:1.4;">{{expiration}}</span>
            </td></tr>
          </table>
          <p class="muted" style="margin:17px 0 24px; color:#9b87a6; text-align:center; font-size:12px; line-height:1.8; word-break:{{wordBreak}}; overflow-wrap:break-word;">{{returnHint}}</p>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f8f4fa" class="notice" style="background-color:#f8f4fa; border-radius:16px;">
            <tr><td style="padding:16px 18px;">
              <p class="mail-ink" style="margin:0 0 5px; color:#7f698d; font-size:12px; line-height:1.6; font-weight:700;">{{noticeTitle}}</p>
              <p class="muted" style="margin:0; color:#a18eab; font-size:12px; line-height:1.8; word-break:{{wordBreak}}; overflow-wrap:break-word;">{{notice}}</p>
            </td></tr>
          </table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr><td height="25" style="height:25px; font-size:1px; line-height:1px;">&nbsp;</td></tr>
            <tr><td align="center" class="divider" style="border-top:1px solid #eee4f0; padding-top:19px;">
              <p class="muted" style="margin:0 0 6px; color:#b09cbb; font-size:10px; line-height:1.5; letter-spacing:1.8px;">REMEMBER + MEMORY</p>
              <p class="muted" style="margin:0; color:#b09cbb; font-size:10px; line-height:1.8; word-break:{{wordBreak}}; overflow-wrap:break-word;">{{footer}}</p>
            </td></tr>
          </table>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
