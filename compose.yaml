name: remory-backend

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-remory}
      MYSQL_USER: ${DB_USER:-remory}
      MYSQL_PASSWORD: ${DB_PASSWORD:-remory-local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-remory-root-local}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  mysql-data:
